[package]
name = "forever-together"
version = "0.1.0"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The window: Tauri and its system libraries (GTK and WebKit on Linux). On by default.
# A headless-only build (a server, a trusted peer) leaves it out and needs none of them:
# `cargo build --release --no-default-features` (ADR 0042).
default = ["ui"]
ui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1.12.2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
futures-lite = "2.6.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15"
iroh = "=1.5.0"
iroh-gossip = "=0.103.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "signal", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "json"] }
varaq = "0.1.1"
iroh-mainline-address-lookup = "0.6"
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
