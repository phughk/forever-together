[tools]
node = "lts"
pnpm = "latest"
rust = { version = "stable", mr_boxington = true, components = "rustfmt,clippy" }
mr-boxington = "latest"

[env]
_.path = ["node_modules/.bin"]

[tasks.setup]
description = "Install JS dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the desktop app (Tauri + Vite)"
run = "pnpm tauri dev"

[tasks.web]
description = "Run the frontend alone in the browser"
run = "pnpm dev"

[tasks.storybook]
description = "Run Storybook"
run = "pnpm storybook"

[tasks.build]
description = "Bundle the app for the host platform"
run = "pnpm tauri build"

[tasks.typecheck]
description = "Typecheck the frontend"
run = "pnpm typecheck"

[tasks.lint]
description = "Clippy (deny warnings) + rustfmt check"
run = [
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --check",
]

[tasks.check]
description = "Everything CI should run"
depends = ["typecheck", "lint"]
