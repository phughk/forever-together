[tools]
node = "lts"
pnpm = "latest"
rust = { version = "stable", mr_boxington = true, components = "rustfmt,clippy" }
mr-boxington = "latest"

[env]
_.path = ["{{config_root}}/webapp/node_modules/.bin"]

[tasks.setup]
description = "Install JS dependencies"
run = "pnpm --dir webapp install"

[tasks.dev]
description = "Run the desktop app (Tauri + Vite)"
dir = "{{config_root}}/app"
run = "tauri dev"

[tasks.web]
description = "Run the frontend alone in the browser"
run = "pnpm --dir webapp dev"

[tasks.storybook]
description = "Run Storybook"
run = "pnpm --dir webapp storybook"

[tasks.build]
description = "Bundle the app for the host platform"
dir = "{{config_root}}/app"
run = "tauri build"

[tasks.typecheck]
description = "Typecheck the frontend"
run = "pnpm --dir webapp typecheck"

[tasks.test]
description = "Rust unit and integration tests (the multi-instance tests take about 40 s)"
run = "cargo test --manifest-path app/Cargo.toml --lib"

[tasks.lint]
description = "Clippy (deny warnings) + rustfmt check"
run = [
  "cargo clippy --manifest-path app/Cargo.toml --all-targets -- -D warnings",
  "cargo fmt --manifest-path app/Cargo.toml --check",
]

[tasks.test-addon]
description = "Build the headless WoW Lua VM (vendor/wow-forever-addons) and run addon/tests/ in it"
run = [
  "git submodule update --init vendor/wow-forever-addons",
  "cargo build -q --manifest-path vendor/wow-forever-addons/wowluavm/Cargo.toml",
  "vendor/wow-forever-addons/wowluavm/target/debug/wowluavm addon/tests/setup.json addon/ForeverTogether addon/tests --no-server --api vendor/wow-forever-addons/wow-forever-api.json",
]

[tasks.install-addon]
description = "Copy addon/ForeverTogether into $WOW_ADDONS_DIR (must end in AddOns)"
run = "scripts/install-addon.sh"

[tasks.check]
description = "Everything CI should run"
depends = ["typecheck", "lint", "test", "test-addon"]

[tasks.update-icons]
description = "Regenerate the app and addon icons from assets/icon_1024.png"
run = "uv run --project scripts scripts/update_icons.py"
